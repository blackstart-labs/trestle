[package]
name = "trestle"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Self-hosted productivity platform — backend foundation"
repository = "https://github.com/maruf-pfc/trestle"
license-file = "LICENSE"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tracing"] }
argon2 = { version = "0.5", features = ["std"] }
base64ct = { version = "1.6", features = ["alloc"] }
dashmap = "6"
rand = { version = "0.9", features = ["os_rng"] }
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "migrate", "macros", "uuid", "time"] }
time = { version = "0.3.36", features = ["macros", "formatting", "parsing"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
