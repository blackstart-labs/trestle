name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Frontend lint, type check, unit tests, dependency audit & build
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend (Lint, Test, Audit & Build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Runner dependency refresh regression
        run: node --test tests/runner-frontend.test.mjs
      - name: Format check
        working-directory: web
        run: npm run format:check
      - name: Design system check
        working-directory: web
        run: npm run lint:design
      - name: Type check (svelte-check)
        working-directory: web
        run: npm run check
      - name: Unit tests (Vitest)
        working-directory: web
        run: npm test
      - name: Dependency vulnerability audit
        working-directory: web
        run: npm audit --audit-level=low
      - name: Production asset build
        working-directory: web
        run: npm run build
      - name: Upload compiled frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Stage 2: Security (govulncheck against the Go module graph)
  # ----------------------------------------------------------------------------
  security:
    name: Security (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download compiled frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Known vulnerabilities in reachable code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # ----------------------------------------------------------------------------
  # Stage 3: Go formatting & vet
  # ----------------------------------------------------------------------------
  go-lint:
    name: Go (gofmt & vet)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download compiled frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet all packages
        run: go vet ./...

  # ----------------------------------------------------------------------------
  # Stage 4: Backend tests & PostgreSQL schema migrations
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend (Tests & Migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: frontend
    services:
      postgres:
        image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_DB: trestle_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trestle_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/trestle_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download compiled frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Tests and PostgreSQL migrations
        run: go test ./...

  # ----------------------------------------------------------------------------
  # Stage 5: Playwright browser smoke tests against live Go server
  # ----------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright Browser Tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: frontend
    services:
      postgres:
        image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_DB: trestle_e2e_browser
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trestle_e2e_browser"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/trestle_e2e_browser
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Download compiled frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests against Go server
        working-directory: web
        run: npm run test:e2e
      - name: Real browser/API/PostgreSQL board journey
        working-directory: web
        env:
          TRESTLE_E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run test:e2e:real

  # ----------------------------------------------------------------------------
  # Stage 6: Production release binary and Docker container verification
  # ----------------------------------------------------------------------------
  package:
    name: Release & Container Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [frontend, go-lint, backend-test]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download compiled frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Release binary build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o trestle .
      - name: Container build verification
        run: docker build --tag trestle:ci .
