# CodeRabbit configuration file
# Reference: https://docs.coderabbit.ai/getting-started/configure-coderabbit

version: "2"
language: "en-US"
tone_instructions: "Be precise, objective, and constructive. Focus on correctness, performance, security, design-system tokens, and accessibility."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
  path_filters:
    - "!web/dist/**"
    - "!web/node_modules/**"
    - "!.tools/**"
    - "!package-lock.json"
    - "!web/package-lock.json"
    - "!migrations/*.sql"
  tools:
    shellcheck:
      enabled: true
    golangci-lint:
      enabled: true
    biome:
      enabled: false

chat:
  auto_reply: true

